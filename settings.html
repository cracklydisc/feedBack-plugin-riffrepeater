<!--
  Riff Repeater settings.

  Deliberately almost empty, the same as Live Tab's: the page is generated by
  `window.riffRepeater.mountSettings`, so it is declared once — in
  `src/ui/settings-page.js` — and this file cannot fall out of step with it.

  It used to build the whole page here, in the host's utility classes, because
  a classic script cannot import the kit or the ladder's constants. The cost
  was the two things this file no longer does: a settings screen that looked
  unrelated to the plugin's own panel, and its own copy of the rung arithmetic
  sitting next to `buildLadder`'s.
-->
<div id="rr-settings" class="p-4 text-sm text-fb-textDim">
  Loading Riff Repeater settings…
</div>

<script>
(function () {
    const root = document.getElementById('rr-settings');
    if (!root) return;

    function mount() {
        const rr = window.riffRepeater;
        if (!rr || typeof rr.mountSettings !== 'function') return false;
        rr.mountSettings(root);
        return true;
    }

    // The plugin's script loads with the app, but a cold settings screen can
    // render first. Retry briefly, then say so rather than sitting on
    // "Loading" for ever — the failure a reader actually hits is a disabled
    // plugin, and "Loading…" tells them nothing about it.
    if (!mount()) {
        let tries = 0;
        const timer = setInterval(() => {
            tries += 1;
            if (mount() || tries > 40) {
                clearInterval(timer);
                if (!window.riffRepeater) {
                    root.textContent = 'Riff Repeater has not loaded. Restart '
                        + 'fee[dB]ack, or check that the plugin is enabled on '
                        + 'the Plugins page.';
                }
            }
        }, 250);
    }
})();
</script>
